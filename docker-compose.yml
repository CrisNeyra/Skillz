services:
  db:
    image: postgres:16-alpine
    container_name: skillz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillz
      POSTGRES_PASSWORD: skillz
      POSTGRES_DB: skillz
    ports:
      - "5432:5432"
    volumes:
      - skillz_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillz -d skillz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skillz_pg_data:
